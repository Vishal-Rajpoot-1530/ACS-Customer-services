name: CI/CD Pipeline - ACS Customer Service Backend

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./Backend
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: ./Backend
        run: npm run typecheck

      - name: Run Unit & Integration Tests
        working-directory: ./Backend
        run: npm run test
        env:
          NODE_ENV: test
          PORT: 5001
          MONGO_URI: mongodb://localhost:27017/acs_test
          JWT_ACCESS_SECRET: test_ci_jwt_access_secret_min_32_characters_12345
          JWT_REFRESH_SECRET: test_ci_jwt_refresh_secret_min_64_characters_abcde_12345
          AWS_REGION: ap-south-1
          AWS_S3_BUCKET_NAME: acs-customer-documents-ci
          FRONTEND_URL: https://acs-customer-service-centre-1.vercel.app
          COOKIE_SECRET: test_ci_cookie_secret_998877

      - name: Build Production Bundle
        working-directory: ./Backend
        run: npm run build

  deploy:
    name: Deploy to AWS EC2
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/acs-backend/Backend
            git pull origin main
            npm ci --only=production
            npm run build
            pm2 reload acs-backend
